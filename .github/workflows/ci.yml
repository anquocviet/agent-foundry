name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            expected_os: darwin
            expected_arch: x86_64
            binary: target/release/agentfoundry
            packaged: agentfoundry-x86_64-apple-darwin
            fault_binary: target/fault-injection/debug/agentfoundry
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            expected_os: darwin
            expected_arch: arm64
            binary: target/release/agentfoundry
            packaged: agentfoundry-aarch64-apple-darwin
            fault_binary: target/fault-injection/debug/agentfoundry
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            expected_os: linux
            expected_arch: x86_64
            binary: target/release/agentfoundry
            packaged: agentfoundry-x86_64-unknown-linux-gnu
            fault_binary: target/fault-injection/debug/agentfoundry
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            expected_os: linux
            expected_arch: aarch64
            binary: target/release/agentfoundry
            packaged: agentfoundry-aarch64-unknown-linux-gnu
            fault_binary: target/fault-injection/debug/agentfoundry
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            expected_os: win32
            expected_arch: amd64
            binary: target/release/agentfoundry.exe
            packaged: agentfoundry-x86_64-pc-windows-msvc.exe
            fault_binary: target/fault-injection/debug/agentfoundry.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip jsonschema

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Cargo tests
        run: cargo test --workspace --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify native target architecture and binary identity
        shell: python
        run: |
          import hashlib, json, platform, subprocess, sys
          from pathlib import Path

          host_os = sys.platform
          host_arch = platform.machine().lower()
          expected_os = "${{ matrix.expected_os }}"
          expected_arch = "${{ matrix.expected_arch }}"

          print(f"Runner Host: OS={host_os}, Arch={host_arch}")
          assert host_os == expected_os, f"Unexpected host OS: {host_os} != {expected_os}"
          arch_matches = (
              host_arch == expected_arch
              or (expected_arch in ('x86_64', 'amd64') and host_arch in ('x86_64', 'amd64'))
              or (expected_arch in ('aarch64', 'arm64') and host_arch in ('aarch64', 'arm64'))
          )
          assert arch_matches, f"Unexpected host Arch: {host_arch} != {expected_arch}"

          binary = Path("${{ matrix.binary }}").resolve()
          assert binary.exists(), f"Binary not found: {binary}"
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()

          out = subprocess.check_output([str(binary), "--version", "--json"], text=True)
          envelope = json.loads(out)
          assert envelope.get("schema") == "agentfoundry.command-result/v1", f"Unexpected schema: {envelope}"
          data = envelope.get("data", {})
          assert data.get("fault_injection") is False, "Release binary must not have fault injection enabled"
          assert data.get("distribution") == "development", f"Expected development distribution, got {data.get('distribution')}"

          print(f"Target: ${{ matrix.target }}")
          print(f"Binary: {binary} ({binary.stat().st_size} bytes)")
          print(f"SHA-256: {digest}")
          print(f"Version: {data.get('version')}")
          print(f"Source: {data.get('source')}")

      - name: Build fault-injection binary
        run: cargo build --locked --features fault-injection --target-dir target/fault-injection

      - name: Stage packaged artifact and identity record
        shell: python
        run: |
          import hashlib, json, shutil, subprocess, sys
          from pathlib import Path

          source = Path("${{ matrix.binary }}").resolve()
          target = "${{ matrix.target }}"
          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          name = "${{ matrix.packaged }}"
          packaged = (dist / name).resolve()
          shutil.copy2(source, packaged)
          digest = hashlib.sha256(packaged.read_bytes()).hexdigest()
          (dist / (name + ".sha256")).write_text(f"{digest}  {name}\n", encoding="utf-8")
          identity = json.loads(subprocess.check_output(
              [str(packaged), "--version", "--json"], text=True))["data"]
          identity.update(platform=target, asset=name, sha256=digest,
                          release_ready=False)
          (dist / "identity.json").write_text(json.dumps(identity, indent=2) + "\n",
                                              encoding="utf-8")
          assert identity["fault_injection"] is False
          assert digest == hashlib.sha256(source.read_bytes()).hexdigest()

      - name: Native packaged T-060 matrix
        run: >-
          python tests/acceptance/native_matrix.py
          --platform "${{ matrix.target }}"
          --binary "dist/${{ matrix.packaged }}"
          --fault-binary "${{ matrix.fault_binary }}"
          --output "dist/native-matrix-${{ matrix.target }}.json"

      - name: Acceptance smoke - check.py
        env:
          TMPDIR: ${{ runner.temp }}
          https_proxy: http://127.0.0.1:9
          http_proxy: http://127.0.0.1:9
          NO_PROXY: ''
        run: python tests/acceptance/check.py ${{ matrix.binary }}

      - name: Acceptance smoke - payload.py
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tests/acceptance/payload.py ${{ matrix.binary }}

      - name: Acceptance smoke - no_bypass.py
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tests/acceptance/no_bypass.py ${{ matrix.binary }}

      - name: Acceptance smoke - activation_mutation.py
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tests/acceptance/activation_mutation.py ${{ matrix.binary }}

      - name: Acceptance smoke - saved_plan.py
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tests/acceptance/saved_plan.py ${{ matrix.binary }}

      - name: Acceptance smoke - inventory.py
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tests/acceptance/inventory.py ${{ matrix.binary }}

      - name: Acceptance smoke - doctor.py
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tests/acceptance/doctor.py ${{ matrix.binary }}

      - name: Acceptance smoke - lock.py
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tests/acceptance/lock.py ${{ matrix.binary }}

      - name: Acceptance smoke - workflow_examples.py
        run: python -B tests/acceptance/workflow_examples.py

      - name: Acceptance smoke - evidence check
        run: python -m unittest discover -s tests/evidence -p check.py -v

      - name: Acceptance smoke - crashes.py
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tests/acceptance/crashes.py ${{ matrix.fault_binary }}

      - name: Acceptance smoke - override_recovery.py
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -B tests/acceptance/override_recovery.py "${{ matrix.binary }}" "${{ matrix.fault_binary }}"

      - name: Native macOS and Linux arm64 conflict-session crash matrix
        if: runner.os == 'macOS' || matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cargo build --locked --example check-session
          candidate="$RUNNER_TEMP/session-candidate"
          python - "$candidate" <<'PY'
          import hashlib, json, shutil, sys
          from pathlib import Path

          candidate = Path(sys.argv[1])
          shutil.copytree('.', candidate, ignore=shutil.ignore_patterns('.git', 'target', 'dist'))
          manifest_path = candidate / 'payload/manifest.json'
          manifest = json.loads(manifest_path.read_text())
          changes = {'AGENTS.md': ('## AgentFoundry', '## AgentFoundry upstream'),
                     'docs/agentfoundry/WORKFLOW.md': ('# Repository Understanding', '# Repository Understanding upstream')}
          for entry in manifest['entries']:
              if entry['target'] in changes:
                  path = candidate / entry['source']
                  before, after = changes.pop(entry['target'])
                  content = path.read_text()
                  assert content.count(before) == 1
                  content = content.replace(before, after, 1)
                  path.write_text(content)
                  entry['sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
          assert not changes, changes
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          cargo build --release --locked --manifest-path "$candidate/Cargo.toml"
          python tests/acceptance/session_matrix.py target/debug/examples/check-session \
            "${{ matrix.binary }}" "$candidate/target/release/agentfoundry" "${{ matrix.fault_binary }}"

      - name: Native macOS and Linux arm64 live stable bootstrap
        if: runner.os == 'macOS' || matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/live-bootstrap-consumer"
          bash scripts/install.sh --directory "$root" --dry-run --claude --json
          test ! -e "$root"
          bash scripts/install.sh --directory "$root" --claude --json
          "$root/scripts/bin/agentfoundry" status --directory "$root" --check-updates --json > "$RUNNER_TEMP/live-status.json"
          python - "$RUNNER_TEMP/live-status.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))['data']
          assert data['release_observation']['repository'] == 'anquocviet/agent-foundry'
          assert data['release_observation']['metadata']['tag']
          PY
          "$root/scripts/bin/agentfoundry" doctor --directory "$root" --json
          "$root/scripts/bin/agentfoundry" update --directory "$root" --json

      - name: Native macOS and Linux arm64 cross-version published upgrade (v0.1.0 -> v0.1.1)
        if: runner.os == 'macOS' || matrix.target == 'aarch64-unknown-linux-gnu'
        shell: python
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          import hashlib, os, subprocess, sys, urllib.request
          from pathlib import Path

          target = "${{ matrix.target }}"
          digests = {
              "x86_64-apple-darwin": (
                  "32bbe29dc6f2649786db8b964bbf249affbed0aaa5a0dbfbb2f959c6d3a14d98",
                  "c4243074309968a890b3ff2b7a4e96a110a860d4201f5512784c5d0847a5ff9e",
              ),
              "aarch64-apple-darwin": (
                  "d10a02b40e99617fd0b8de57c64dc6ccef8a5499e89c121f489f2b3621bd7700",
                  "25e38a6da3d934ee3d06f7cad16e37ebdfabc84400bae08f23c6d3b0f11e7f5a",
              ),
              "aarch64-unknown-linux-gnu": (
                  "186d43c9c90558c61f75a9df8ab0daadd485c08cea7d9987bcd810163f756fd9",
                  "ad92f185b385b7f43647a30ca02340551945b0b89670535ce6495050f4413b7c",
              ),
          }
          v010_sha, v011_sha = digests[target]
          url = f"https://github.com/anquocviet/agent-foundry/releases/download/v0.1.0/agentfoundry-{target}"
          baseline = Path(os.environ["RUNNER_TEMP"]) / f"v0.1.0-agentfoundry-{target}"
          with urllib.request.urlopen(url, timeout=60) as resp:
              data = resp.read()
          actual = hashlib.sha256(data).hexdigest()
          assert actual == v010_sha, f"v0.1.0 digest mismatch for {target}: {actual} != {v010_sha}"
          baseline.write_bytes(data)
          baseline.chmod(0o755)
          subprocess.run(
              [sys.executable, "-B", "tests/acceptance/published_upgrade.py", str(baseline), "0.1.1", v011_sha],
              check=True,
          )

      - name: Acceptance smoke - interactive.py (POSIX)
        if: runner.os != 'Windows'
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tests/acceptance/interactive.py ${{ matrix.binary }}

      - name: Acceptance smoke - windows_launcher.py (Windows)
        if: runner.os == 'Windows'
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tests/acceptance/windows_launcher.py ${{ matrix.binary }} ${{ matrix.fault_binary }}

      - name: Acceptance smoke - windows_replacefile.py (Windows)
        if: runner.os == 'Windows'
        run: python -B tests/acceptance/windows_replacefile.py ${{ matrix.fault_binary }}

      - name: Native Windows v0.1.0 override crash rollback
        if: runner.os == 'Windows'
        shell: python
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          import hashlib, os, subprocess, sys, urllib.request
          from pathlib import Path

          v010_sha = "8ca4d9d67d49bef9d45556834fb52ad8cd8f1f3fc541971527f9256f81a1764a"
          url = "https://github.com/anquocviet/agent-foundry/releases/download/v0.1.0/agentfoundry-x86_64-pc-windows-msvc.exe"
          baseline = Path(os.environ["RUNNER_TEMP"]) / "v0.1.0-agentfoundry-x86_64-pc-windows-msvc.exe"
          with urllib.request.urlopen(url, timeout=60) as resp:
              data = resp.read()
          actual = hashlib.sha256(data).hexdigest()
          assert actual == v010_sha, f"v0.1.0 Windows digest mismatch: {actual} != {v010_sha}"
          baseline.write_bytes(data)
          subprocess.run(
              [sys.executable, "-B", "tests/acceptance/override_recovery.py", str(baseline), "${{ matrix.fault_binary }}"],
              check=True,
          )

      - name: Acceptance smoke - schemas.py (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python tests/acceptance/schemas.py ${{ matrix.binary }}

      - name: Archive packaged artifact and T-060 proof (no publish)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentfoundry-development-${{ matrix.target }}
          path: dist/
          if-no-files-found: warn
