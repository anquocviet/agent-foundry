name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag used by the successful bundle run
        required: true
        type: string
      run_id:
        description: Successful stable candidate workflow run ID
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  draft:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source run and tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ ]]
          commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["path"] == ".github/workflows/stable-candidate.yml" and r["status"] == "completed" and r["conclusion"] == "success" and r["head_sha"] == sys.argv[2]' "$RUNNER_TEMP/source-run.json" "$commit"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name stable-release-bundle --dir bundle
          python3 scripts/verify-release-bundle.py bundle "$RELEASE_TAG" "$commit"
      - name: Create verified draft, never publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-draft-release.py "$RELEASE_TAG" "$CANDIDATE_COMMIT" bundle "$GITHUB_REPOSITORY"
